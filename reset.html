<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roots | استعادة الحساب</title>
<style>body{margin:0;background:#f3f5ee;color:#193e30;font-family:system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}main{background:white;padding:32px;border-radius:20px;width:min(400px,80vw);box-shadow:0 10px 40px #193e3010}h1{font-size:25px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border-radius:10px;border:1px solid #bac9bf;margin-top:8px}button{background:#245c40;color:white;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.8}a{color:#245c40}[hidden]{display:none!important}</style>
<main><b>ROOTS</b><h1>استعادة الحساب</h1><p id="status" role="status">جاري التحقق من الرابط…</p>
<form id="recover" hidden><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required dir="ltr"></label><button>إرسال رابط جديد</button></form>
<form id="change" hidden><label>كلمة المرور الجديدة<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><label>تأكيد كلمة المرور<input id="confirm" type="password" autocomplete="new-password" minlength="6" required></label><button>حفظ كلمة المرور</button></form>
<p><a href="admin.html">بوابة الإدارة</a> · <a href="teacher.html">بوابة المعلم</a> · <a href="parent.html">بوابة الأهل</a></p></main>
<script src="auth-config.js"></script><script>
(()=>{'use strict';const cfg=window.ROOTS_AUTH||{},status=document.getElementById('status'),recover=document.getElementById('recover'),change=document.getElementById('change');let token=null;const fragment=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);const candidate=fragment.get('type')==='recovery'?fragment.get('access_token'):null;const failed=fragment.has('error');fragment.forEach((_,key)=>fragment.delete(key));
async function request(path,body,access){const r=await fetch(cfg.url+path,{method:body?'POST':'GET',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('failed');return r.status===204?null:r.json();}
recover.addEventListener('submit',async e=>{e.preventDefault();const button=recover.querySelector('button');button.disabled=true;try{await request('/auth/v1/recover?redirect_to='+encodeURIComponent(new URL('reset.html',location.href).href),{email:document.getElementById('email').value.trim()});status.textContent='إذا كان البريد مسجلًا، ستصلك رسالة استعادة. افتح أحدث رسالة واستخدم الرابط مرة واحدة.';}catch{status.textContent='تعذّر إرسال الرسالة. حاول لاحقًا.';}finally{button.disabled=false;}});
change.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password'),confirm=document.getElementById('confirm'),button=change.querySelector('button');if(password.value!==confirm.value){status.textContent='كلمتا المرور غير متطابقتين.';return;}button.disabled=true;try{const r=await fetch(cfg.url+'/auth/v1/user',{method:'PUT',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok)throw Error('failed');const old=token;token=null;change.reset();change.hidden=true;status.textContent='تم تغيير كلمة المرور. افتح بوابتك وسجّل الدخول بكلمة المرور الجديدة.';fetch(cfg.url+'/auth/v1/logout',{method:'POST',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+old}}).catch(()=>{});}catch{status.textContent='تعذّر تغيير كلمة المرور. استخدم كلمة مختلفة أو اطلب رابطًا جديدًا.';}finally{password.value=confirm.value='';button.disabled=false;}});
(async()=>{if(candidate){try{await request('/auth/v1/user',null,candidate);token=candidate;change.hidden=false;status.textContent='اختر كلمة مرور جديدة من ٦ أحرف على الأقل.';return;}catch{}}recover.hidden=false;status.textContent=failed||candidate?'الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.':'أدخل بريد حساب Roots لإرسال رابط استعادة كلمة المرور.';})();window.addEventListener('pagehide',()=>{token=null;change.reset();});})();
</script></html>
