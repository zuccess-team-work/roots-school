<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer"><title>Roots | استعادة الحساب</title>
 <link rel="stylesheet" href="recovery.css?v=readiness-20261104-r9">
 <script src="auth-config.js" defer></script><script src="recovery.js?v=readiness-20261104-r9" defer></script>
</head>
<body><main>
 <header><b>ROOTS</b><button id="recovery-language" type="button" aria-label="Switch to English">AR / EN</button></header>
 <h1 data-ar="استعادة الحساب" data-en="Recover your account">استعادة الحساب</h1>
 <p id="status" role="status" aria-live="polite">جاري التحقق من الرابط…</p>
 <form id="recover" hidden>
  <label for="email" data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="email" required maxlength="254" dir="ltr">
  <button type="submit" data-ar="إرسال رابط جديد" data-en="Send a new link">إرسال رابط جديد</button>
 </form>
 <form id="change" hidden>
  <label for="password" data-ar="كلمة المرور الجديدة" data-en="New password">كلمة المرور الجديدة</label>
  <input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
  <label for="confirm" data-ar="تأكيد كلمة المرور" data-en="Confirm password">تأكيد كلمة المرور</label>
  <input id="confirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
  <button type="submit" data-ar="حفظ كلمة المرور" data-en="Save password">حفظ كلمة المرور</button>
 </form>
 <nav aria-label="البوابات"><a href="admin.html" data-ar="بوابة الإدارة" data-en="Admin portal">بوابة الإدارة</a><a href="teacher.html" data-ar="بوابة المعلّم" data-en="Teacher portal">بوابة المعلّم</a><a href="parent.html" data-ar="بوابة الأهل" data-en="Parent portal">بوابة الأهل</a></nav>
</main></body></html>
